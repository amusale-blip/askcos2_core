events {
  worker_connections  1024;
}

http {
    include /etc/nginx/mime.types;

    # Extra
    proxy_read_timeout 600;
    uwsgi_read_timeout 600;

    server {
        listen 80;
        server_name askcos;
        charset     utf-8;
        client_max_body_size 25M;

        # Route all the vue build pages
        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # Finally, send all non-media requests to the Fastapi server.
        location /api/ {
            proxy_pass  http://0.0.0.0:9100;
        }

        # Proxy MCP Streamable HTTP endpoint to the FastAPI server.
        location /mcp {
            proxy_pass http://0.0.0.0:9100;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            # Disable buffering so SSE chunks flow through.
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            proxy_redirect off;
            proxy_read_timeout 600;
        }
    }
}
